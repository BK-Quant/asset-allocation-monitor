name: 데이터 갱신 (전월 말 종가 → 이번달 신호)

on:
  schedule:
    # 매월 1일 07:00 KST = 전월 말일 22:00 UTC.
    # ⚠️ 예전엔 한국장용 크론(전월 말일 19:00 KST)도 따로 뒀었는데, previous_complete_month_index()가
    # "오늘이 속한 달의 전달"로만 계산해서 월말 당일(예: 7/31)엔 여전히 그 전전달(6월) 기준으로
    # 나오는 버그가 있었다(달력이 실제로 다음 달로 넘어가야만 전달 기준으로 플립됨) — 즉 한국장
    # 크론은 사실상 아무 기준도 못 바꾸는 무의미한 재계산이었음. 그래서 실제로 기준이 정확히
    # 플립되는 이 크론(매월 1일 07시) 하나로 단순화했다.
    # GitHub Actions cron은 "월말"을 직접 표현할 수 없어, 매월 마지막 날짜(28~31일)에 매일
    # 걸어두고 아래 "월말 여부 확인" 스텝에서 실제로 그달의 마지막 날일 때만 갱신을 진행한다.
    - cron: "0 22 28-31 * *"
  workflow_dispatch: {} # 수동 실행 버튼 (Actions 탭에서 즉시 재계산 가능, 월말 여부와 무관하게 항상 실행)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 월말 여부 확인 (scheduled 실행에만 적용)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tomorrow=$(date -u -d tomorrow +%d)
            if [ "$tomorrow" != "01" ]; then
              echo "오늘은 이 달의 마지막 날이 아님(내일=${tomorrow}일) — 갱신 생략"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: 가격·매크로 데이터 수집
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_data.py

      - name: 전략 신호·백테스트 계산
        if: steps.gate.outputs.run == 'true'
        run: python scripts/build_output.py

      - name: 변경사항 커밋
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" || git commit -m "chore: 데이터 자동 갱신 $(date -u +%Y-%m-%d) ${{ github.event.schedule }}"
          git push
